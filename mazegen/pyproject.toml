
[project]
name = "mazegen"
version = "0.1.1"
description = "A maze generator"
authors = [
  {name = "durisosa", email = "durisosa@student.42madrid.com"},
  {name = "sasilves", email = "sasilves@student.42madrid.com"},
]
readme = "README.md"
packages =[{ include = "*" }]
license = "MIT"
keywords = ["egg", "bacon", "sausage", "tomatoes", "Lobster Thermidor"]
requires-python = ">=3.10"

[tool.poetry]
version = "0.1.1"
package-mode = true

[project.urls]
Repository = "https://github.com/me/spam.git"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.13.5"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
mypy = "^1.8.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"

[tool.poetry.group.test]
optional = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
