<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 

    <title>Grid básico</title>

 

    <style>

        body {

            font-family: Arial, sans-serif;

        }

 

        .grid {

            display: grid;

 

            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
             /* Restores text direction */

            gap: 20px;

        }

 

        .caja {

            padding: 40px;

 

            background-color: seagreen;

 

            color: white;

 

            text-align: center;

 

            font-size: 25px;

        }

    </style>

</head>

 

<body>

 

    <h1>CSS Grid</h1>

 

    <div class="grid">

 

        <div class="caja">1</div>

        <div class="caja">2</div>

        <div class="caja">Eventos</div>

 

        <div class="caja">Manuel</div>

        <div class="caja">Sosa</div>

        <div class="caja">Corrige</div>

 

        <div class="caja">7</div>

        <div class="caja">8</div>

        <div id="caja-9" class="caja">9</div>

 

    </div>

 

</body>

</html>
